# Publish @mirasim/computer-use and its four platform packages to npm, then submit the browser
# extension to the Chrome Web Store when it carries a version the store does not have yet.
#
# A release is pushing a tag `v<version>` that matches package.json; a manual run is a dry run
# unless told otherwise. The helpers are compiled on the OS that can build them (Swift on macOS,
# Rust on Windows, cross-compiled to the second arch on each) and published as
# `@mirasim/computer-use-<platform>-<arch>`; the main package then lists them as optional
# dependencies at the same version (scripts/platform-packages.mjs) and goes out last, so no
# published version ever names a helper the registry lacks.
#
# Publishing authenticates with npm trusted publishing (OIDC), configured for this repository and
# workflow on each of the five packages; it works while the repository is private. Provenance is
# attached only while the repository is public: npm accepts it from public repositories only.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and check everything, publish nothing"
        type: boolean
        default: true
      skip_store_check:
        description: "Publish even if the Chrome Web Store cannot be asked which extension it serves"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Runs beside the helper builds; the publish job waits for all four, so a failure here
  # publishes nothing.
  browser:
    uses: ./.github/workflows/browser.yml

  # The bridge asks every user for MINIMUM_EXTENSION_VERSION; a release whose minimum the Chrome Web
  # Store does not serve yet would hold every browser task on the extension route back (T-4050).
  # Asks the store's public update check, the one Chrome polls: no credentials.
  store-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: the store serves the extension this release asks for
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_store_check) }}
        run: node scripts/web-store.mjs --check-minimum
      - name: store check skipped by hand
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_store_check }}
        run: echo "::warning::The Chrome Web Store check was skipped by hand; this release may ask users for an extension the store does not serve."

  helpers-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # A helper whose sources and compiler did not change is copied, not compiled (the script
      # checks both itself, so a stale entry is never used).
      - uses: actions/cache@v4
        with:
          path: .helper-cache
          key: helpers-macos-${{ hashFiles('src/platform/macos/ax/*.swift') }}
          restore-keys: helpers-macos-
      - run: node scripts/platform-packages.mjs build darwin-arm64 darwin-x64 --out dist-platform --cache .helper-cache
      - uses: actions/upload-artifact@v4
        with:
          name: helpers-macos
          path: dist-platform/
          if-no-files-found: error

  helpers-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The runner's rustup carries only the host target.
      - run: rustup target add aarch64-pc-windows-msvc
      # Compiled crates (windows-rs is most of the build), for when the helper itself changed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/platform/windows/uia -> target
      - uses: actions/cache@v4
        with:
          path: .helper-cache
          key: helpers-windows-${{ hashFiles('src/platform/windows/uia/Cargo.*', 'src/platform/windows/uia/src/**') }}
          restore-keys: helpers-windows-
      - run: node scripts/platform-packages.mjs build win32-x64 win32-arm64 --out dist-platform --cache .helper-cache
      - uses: actions/upload-artifact@v4
        with:
          name: helpers-windows
          path: dist-platform/
          if-no-files-found: error

  publish:
    needs: [browser, store-minimum, helpers-macos, helpers-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      PROVENANCE: ${{ !github.event.repository.private && '--provenance' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}" >&2; exit 1; }
      # A prerelease (`0.1.0-rc.1`) goes to the `next` dist-tag, all five packages alike, so
      # `npm install @mirasim/computer-use` keeps resolving the last release.
      - name: dist-tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          echo "DIST_TAG=$tag" >> "$GITHUB_ENV"
          echo "publishing $version as $tag"
      - uses: actions/download-artifact@v4
        with:
          path: dist-platform/
          merge-multiple: true
      # Artifacts drop the mode bits, and npm packs the mode it finds: without this the macOS
      # helper installs unexecutable. A lost artifact is an empty directory; refuse before
      # anything is published.
      - name: every helper is present and executable
        run: |
          for t in darwin-arm64 darwin-x64; do chmod 755 "dist-platform/$t/computer-use-ax-helper"; done
          for t in win32-x64 win32-arm64; do test -s "dist-platform/$t/computer-use-uia-helper.exe"; done
      # The package ships the minified build, never source: refuse before anything is published.
      - name: the package carries no source
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const source = files.filter((p) => /^src\//.test(p) || (/\.[cm]?ts$/.test(p) && !/\.d\.[cm]?ts$/.test(p)) || /\.(swift|rs)$|(^|\/)Cargo\.(toml|lock)$/.test(p));
            if (source.length) { console.error("source in the package:\n" + source.join("\n")); process.exit(1); }
            console.log(files.length + " files, no source");'
      # A re-run after a partial publish skips what the registry already has: versions are immutable.
      - name: publish platform packages
        run: |
          for dir in dist-platform/*/; do
            spec="$(node -p "const p = require('./${dir}package.json'); p.name + '@' + p.version")"
            if npm view "$spec" version >/dev/null 2>&1; then echo "$spec already published"; continue; fi
            npm publish "$dir" --access public --tag "$DIST_TAG" $PROVENANCE $DRY_RUN
          done
      - name: publish @mirasim/computer-use
        run: |
          node scripts/platform-packages.mjs pin
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version >/dev/null 2>&1; then echo "$spec already published"; exit 0; fi
          npm publish --access public --tag "$DIST_TAG" $PROVENANCE $DRY_RUN

  # Uploads the extension to the Chrome Web Store and submits it for review, when
  # extension/manifest.json carries a version newer than the store's (web-store.yml). After npm,
  # so a release that failed never reaches the store. A manual run is a dry run here: it packs and
  # reads the store, which checks the credentials; run web-store.yml itself to upload by hand.
  web-store:
    # The 0.1.1 standalone release uses the existing 0.1.4 store listing.
    if: github.ref != 'refs/tags/v0.1.1'
    needs: publish
    uses: ./.github/workflows/web-store.yml
    with:
      dry_run: ${{ github.event_name != 'push' }}
    secrets: inherit

  # Lists the release in the official MCP Registry (registry.modelcontextprotocol.io) as
  # io.github.mirasim-ai/computer-use, from server.json with the version set to this release. The
  # registry accepts it only once npm has that version and its package.json names the server in
  # `mcpName`, so this waits for the publish job. GitHub OIDC grants this repository the
  # io.github.mirasim-ai/* namespace: no secret. A manual run publishes nothing here.
  mcp-registry:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: server.json carries the released version
        run: |
          node -e '
            const fs = require("fs");
            const { version, mcpName } = require("./package.json");
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            if (s.name !== mcpName) { console.error(`server.json names ${s.name}, package.json ${mcpName}`); process.exit(1); }
            s.version = version;
            for (const p of s.packages) p.version = version;
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
            console.log(`registering ${s.name} ${version}`);'
      # npm answers a publish before it serves the version ("may take a few minutes to become
      # available"), and the registry refuses a version npm does not serve yet.
      - name: wait until npm serves this version
        run: |
          version="$(node -p 'require("./package.json").version')"
          for i in $(seq 1 40); do
            name="$(npm view "@mirasim/computer-use@$version" mcpName 2>/dev/null || true)"
            if [ -n "$name" ]; then echo "npm serves $version with mcpName $name"; exit 0; fi
            sleep 15
          done
          echo "npm still does not serve @mirasim/computer-use@$version after 10 minutes" >&2
          exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
